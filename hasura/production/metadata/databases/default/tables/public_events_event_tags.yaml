table:
  name: events_event_tags
  schema: public
object_relationships:
  - name: event
    using:
      foreign_key_constraint_on: event_id
  - name: event_tag
    using:
      foreign_key_constraint_on: tag_id
insert_permissions:
  - role: user
    permission:
      check:
        event:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - user:
                status:
                  _eq: active
      columns:
        - event_id
        - tag_id
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter:
        event:
          _and:
            - user_id:
                _eq: X-Hasura-User-Id
            - user:
                status:
                  _eq: active
    comment: ""
