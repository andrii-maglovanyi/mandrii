table:
  name: venue_beauty_salon_details
  schema: public
object_relationships:
  - name: venue
    using:
      foreign_key_constraint_on: venue_id
insert_permissions:
  - role: user
    permission:
      check:
        venue:
          _or:
            - owner:
                _and:
                  - id:
                      _eq: X-Hasura-User-Id
                  - status:
                      _eq: active
            - _and:
                - owner_id:
                    _is_null: true
                - user:
                    _and:
                      - id:
                          _eq: X-Hasura-User-Id
                      - status:
                          _eq: active
      columns:
        - appointment_required
        - services
        - venue_id
        - walk_ins_accepted
    comment: ""
select_permissions:
  - role: public
    permission:
      columns:
        - appointment_required
        - services
        - venue_id
        - walk_ins_accepted
      filter:
        _or:
          - venue:
              status:
                _eq: ACTIVE
          - venue:
              status:
                _eq: ARCHIVED
    comment: ""
  - role: user
    permission:
      columns:
        - appointment_required
        - services
        - venue_id
        - walk_ins_accepted
      filter:
        _or:
          - venue:
              user_id:
                _eq: X-Hasura-User-Id
          - venue:
              status:
                _eq: ACTIVE
          - venue:
              status:
                _eq: ARCHIVED
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - appointment_required
        - services
        - walk_ins_accepted
      filter:
        venue:
          _or:
            - owner:
                _and:
                  - id:
                      _eq: X-Hasura-User-Id
                  - status:
                      _eq: active
            - _and:
                - owner_id:
                    _is_null: true
                - user:
                    _and:
                      - id:
                          _eq: X-Hasura-User-Id
                      - status:
                          _eq: active
      check: null
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter:
        venue:
          _or:
            - owner:
                _and:
                  - id:
                      _eq: X-Hasura-User-Id
                  - status:
                      _eq: active
            - _and:
                - owner_id:
                    _is_null: true
                - user:
                    _and:
                      - id:
                          _eq: X-Hasura-User-Id
                      - status:
                          _eq: active
    comment: ""
