table:
  name: conversations
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: user_id
  - name: venue
    using:
      foreign_key_constraint_on: venue_id
array_relationships:
  - name: messages
    using:
      foreign_key_constraint_on:
        column: conversation_id
        table:
          name: messages
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - user_id
        - venue_id
        - telegram_thread_id
        - created_at
        - owner_last_read_at
        - user_last_read_at
      filter:
        _or:
          - user_id:
              _eq: X-Hasura-User-Id
          - venue:
              owner_id:
                _eq: X-Hasura-User-Id
