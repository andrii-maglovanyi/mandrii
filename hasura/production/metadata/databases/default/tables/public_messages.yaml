table:
  name: messages
  schema: public
object_relationships:
  - name: conversation
    using:
      foreign_key_constraint_on: conversation_id
array_relationships:
  - name: reactions
    using:
      manual_configuration:
        column_mapping:
          id: message_id
        insertion_order: null
        remote_table:
          name: message_reactions
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - conversation_id
        - telegram_message_id
        - telegram_chat_id
        - telegram_delivered_at
        - deleted_at
        - edited_at
        - edited_by_user_id
        - created_at
        - sender_type
        - body
        - reply_to_message_id
      filter:
        conversation:
          _or:
            - user_id:
                _eq: X-Hasura-User-Id
            - venue:
                owner_id:
                  _eq: X-Hasura-User-Id
